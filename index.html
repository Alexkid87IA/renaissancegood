<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Titre de repli uniquement. title/description/og/twitter sont posés par
         page dans SEO.tsx (react-helmet). On ne les met PAS en statique ici :
         sur une page prérendue, la version statique apparaîtrait en premier et
         l'emporterait (og first-wins), écrasant la balise par page. -->
    <title>Renaissance Eyewear. Lunetterie française, titane or 18KT</title>
    <meta name="author" content="Renaissance Eyewear" />

    <!-- Additional SEO -->
    <meta name="robots" content="index, follow" />
    <meta name="language" content="French" />
    <meta name="revisit-after" content="7 days" />
    <!-- Pas de canonical statique : il est posé par page dans SEO.tsx (react-helmet). Un canonical racine ici entrerait en conflit sur chaque route. -->

    <!-- Google Fonts : preconnect + non-blocking -->
    <!-- Polices auto-hébergées via @fontsource (importées dans src/main.tsx) — plus aucun appel à Google Fonts. -->

    <link rel="preconnect" href="https://renaissance-cdn.b-cdn.net" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#fafaf8" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Intercepte les erreurs de chargement de modules (cache périmé après déploiement)
      // et force un rechargement propre de la page.
      window.addEventListener('error', function(e) {
        if (e.message && (
          e.message.includes('Failed to fetch dynamically imported module') ||
          e.message.includes('Importing a module script failed') ||
          e.message.includes('error loading dynamically imported module')
        )) {
          var key = '_reload_stale';
          var count = parseInt(sessionStorage.getItem(key) || '0', 10);
          if (count < 2) {
            sessionStorage.setItem(key, String(count + 1));
            window.location.href = window.location.href.split('?')[0] + '?_r=' + Date.now();
            return;
          }
          sessionStorage.removeItem(key);
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var msg = e.reason && (e.reason.message || String(e.reason));
        if (msg && (
          msg.includes('Failed to fetch dynamically imported module') ||
          msg.includes('Importing a module script failed') ||
          msg.includes('error loading dynamically imported module') ||
          msg.includes('Loading chunk') ||
          msg.includes('Loading CSS chunk')
        )) {
          var key = '_reload_stale';
          var count = parseInt(sessionStorage.getItem(key) || '0', 10);
          if (count < 2) {
            sessionStorage.setItem(key, String(count + 1));
            window.location.href = window.location.href.split('?')[0] + '?_r=' + Date.now();
            return;
          }
          sessionStorage.removeItem(key);
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
